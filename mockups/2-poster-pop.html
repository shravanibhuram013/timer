<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poster Pop – mockup</title>
  <style>

* { box-sizing: border-box; }
body { margin: 0; padding: 24px; }
h1 { margin: 0 0 4px; } h2 { margin: 28px 0 12px; font-size: 18px; }
.note { margin: 0; opacity: .7; }
.row { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; }
figure { margin: 0; } figcaption { margin-top: 8px; font-size: 14px; }
.device { position: relative; overflow: hidden; border: 6px solid #111; }
.laptop { width: 520px; height: 325px; border-radius: 10px; --time: 54px; --pad: 18px; --fs: 14px; }
.phone { width: 230px; height: 460px; border-radius: 28px; --time: 44px; --pad: 14px; --fs: 13px; }
.screen { position: absolute; inset: 0; overflow: hidden; font-size: var(--fs); }
.art { position: absolute; inset: -30px; }
.before .art, .running .art { filter: blur(14px); }
.running .art { filter: blur(6px); }
.panel { position: absolute; padding: var(--pad); }
.panel p { margin: 0; }
.time { font-size: var(--time); font-variant-numeric: tabular-nums; line-height: 1.1; }
.buttons { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.btn { display: inline-block; padding: 8px 14px; }
.details { margin-top: 10px; line-height: 1.4; }

body { background: #fff3c4; color: #111; font-family: 'Arial Black', Impact, Helvetica, sans-serif; }
.art { background: linear-gradient(135deg, #3a86ff 0%, #8338ec 35%, #ff006e 70%, #ffbe0b 100%); }
.finished .art { filter: none; }
.panel { background: #ffbe0b; border: 4px solid #111; box-shadow: 6px 6px 0 #111; text-transform: uppercase; }
.laptop .panel { left: 16px; top: 16px; width: 200px; }
.phone .panel { left: 12px; right: 12px; bottom: 14px; }
.finished .panel { background: #ff6b9d; }
.label { font-size: 12px; letter-spacing: .08em; }
.time { font-weight: 900; }
.laptop .time { font-size: 46px; } .phone .time { font-size: 40px; }
.btn { background: #fff; border: 3px solid #111; box-shadow: 3px 3px 0 #111; font-size: 12px; }
.btn.main { background: #3a86ff; color: #fff; }
.details { font-family: Helvetica, Arial, sans-serif; text-transform: none; font-weight: 700; }
.details .name { font-size: 1.2em; text-transform: uppercase; } .link { text-decoration: underline; }
.laptop .finished .panel { width: 240px; }
  </style>
</head>
<body>
  <h1>Poster Pop</h1>
  <p class="note">Design mockup only. The coloured picture stands in for a real painting.</p>
  <h2>Laptop screen</h2>
  <div class="row">
      <figure>
        <div class="device laptop"><div class="screen before">
          <div class="art"></div>
          <div class="panel">
            <p class="label">Ready</p>
            <p class="time">25:00</p>
            <div class="buttons"><span class="btn main">Start</span><span class="btn">Reset</span></div>

          </div>
        </div></div>
        <figcaption>1. Before starting</figcaption>
      </figure>
      <figure>
        <div class="device laptop"><div class="screen running">
          <div class="art"></div>
          <div class="panel">
            <p class="label">Focus time</p>
            <p class="time">17:42</p>
            <div class="buttons"><span class="btn main">Pause</span><span class="btn">Reset</span></div>

          </div>
        </div></div>
        <figcaption>2. Timer running</figcaption>
      </figure>
      <figure>
        <div class="device laptop"><div class="screen finished">
          <div class="art"></div>
          <div class="panel">
            <p class="label">Finished</p>
            <p class="time">00:00</p>
            <div class="buttons"><span class="btn main">Restart session</span></div>
            <div class="details"><p class="name">Landscape</p><p>Carl Rottmann</p><p>ca. 1835–45</p><p class="link">Read about this painting &rarr;</p></div>
          </div>
        </div></div>
        <figcaption>3. Timer finished</figcaption>
      </figure>
  </div>
  <h2>Phone screen</h2>
  <div class="row">
      <figure>
        <div class="device phone"><div class="screen before">
          <div class="art"></div>
          <div class="panel">
            <p class="label">Ready</p>
            <p class="time">25:00</p>
            <div class="buttons"><span class="btn main">Start</span><span class="btn">Reset</span></div>

          </div>
        </div></div>
        <figcaption>1. Before starting</figcaption>
      </figure>
      <figure>
        <div class="device phone"><div class="screen running">
          <div class="art"></div>
          <div class="panel">
            <p class="label">Focus time</p>
            <p class="time">17:42</p>
            <div class="buttons"><span class="btn main">Pause</span><span class="btn">Reset</span></div>

          </div>
        </div></div>
        <figcaption>2. Timer running</figcaption>
      </figure>
      <figure>
        <div class="device phone"><div class="screen finished">
          <div class="art"></div>
          <div class="panel">
            <p class="label">Finished</p>
            <p class="time">00:00</p>
            <div class="buttons"><span class="btn main">Restart session</span></div>
            <div class="details"><p class="name">Landscape</p><p>Carl Rottmann</p><p>ca. 1835–45</p><p class="link">Read about this painting &rarr;</p></div>
          </div>
        </div></div>
        <figcaption>3. Timer finished</figcaption>
      </figure>
  </div>
</body>
</html>
