<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pomodoro Art</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="screen">
    <div class="art"></div>
    <section class="panel">
      <p class="label">Ready</p>
      <p class="time">25:00</p>
      <div class="setter">
        <label>Minutes
          <input class="mins" type="text" inputmode="numeric" maxlength="3" value="25" autocomplete="off">
        </label>
        <label>Seconds
          <input class="secs" type="text" inputmode="numeric" maxlength="2" value="00" autocomplete="off">
        </label>
      </div>
      <p class="message" role="alert" hidden></p>
      <div class="buttons">
        <button class="btn main" type="button">Start</button>
        <button class="btn reset" type="button">Reset</button>
        <button class="btn main restart" type="button" hidden>Restart session</button>
      </div>
      <div class="details" hidden>
        <p class="name">Painting name</p>
        <p class="artist">Artist name</p>
        <p class="year">Year</p>
        <p><a class="link" href="https://www.metmuseum.org/" target="_blank" rel="noopener">Read about this painting &rarr;</a></p>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
